openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HindaviSwarajya Seva Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: Seva post operations
  - name: users
    description: User operations
  - name: stats
    description: Platform statistics
  - name: tags
    description: Tag operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List seva posts
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [Food, Education, Health, Shelter, Other]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [recent, likes, impact, comments]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of seva posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SevaPost"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a seva post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevaPost"

  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a seva post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Seva post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevaPost"
        "404":
          description: Not found

  /posts/{id}/like:
    post:
      operationId: toggleLike
      tags: [posts]
      summary: Toggle like on a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LikeBody"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevaPost"

  /posts/{id}/comments:
    post:
      operationId: addComment
      tags: [posts]
      summary: Add comment to a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCommentBody"
      responses:
        "201":
          description: Added comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found

  /users/{id}/follow:
    post:
      operationId: toggleFollow
      tags: [users]
      summary: Follow or unfollow a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowBody"
      responses:
        "200":
          description: Follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"

  /users/{id}/posts:
    get:
      operationId: getUserPosts
      tags: [users]
      summary: Get posts by a specific user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User's seva posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SevaPost"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get platform-wide impact summary
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [stats]
      summary: Get top seva contributors
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /tags/trending:
    get:
      operationId: getTrendingTags
      tags: [tags]
      summary: Get trending hashtags
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Trending tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendingTag"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Rank:
      type: string
      enum: [Sevak, Karyakarta, Nayak, Veer, Sardar]

    SevaCategory:
      type: string
      enum: [Food, Education, Health, Shelter, Other]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
        location:
          type: string
        rank:
          $ref: "#/components/schemas/Rank"
        totalHelped:
          type: integer
        followersCount:
          type: integer
        postsCount:
          type: integer
      required:
        - id
        - name
        - avatar
        - location
        - rank
        - totalHelped
        - followersCount
        - postsCount

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            bio:
              type: string
            joinedAt:
              type: string

    Comment:
      type: object
      properties:
        id:
          type: integer
        postId:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        userAvatar:
          type: string
        content:
          type: string
        timestamp:
          type: string
      required:
        - id
        - postId
        - userId
        - userName
        - userAvatar
        - content
        - timestamp

    SevaPost:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        content:
          type: string
        category:
          $ref: "#/components/schemas/SevaCategory"
        helpedPeople:
          type: integer
        likes:
          type: integer
        likedBy:
          type: array
          items:
            type: integer
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        tags:
          type: array
          items:
            type: string
        image:
          type: string
          nullable: true
        timestamp:
          type: string
        location:
          type: string
          nullable: true
      required:
        - id
        - userId
        - user
        - content
        - category
        - helpedPeople
        - likes
        - likedBy
        - comments
        - tags
        - timestamp

    CreatePostBody:
      type: object
      properties:
        userId:
          type: integer
        content:
          type: string
        category:
          $ref: "#/components/schemas/SevaCategory"
        helpedPeople:
          type: integer
        tags:
          type: array
          items:
            type: string
        image:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
      required:
        - userId
        - content
        - category
        - helpedPeople
        - tags

    LikeBody:
      type: object
      properties:
        userId:
          type: integer
      required:
        - userId

    AddCommentBody:
      type: object
      properties:
        userId:
          type: integer
        content:
          type: string
      required:
        - userId
        - content

    FollowBody:
      type: object
      properties:
        followerId:
          type: integer
      required:
        - followerId

    FollowResult:
      type: object
      properties:
        following:
          type: boolean
        followersCount:
          type: integer
      required:
        - following
        - followersCount

    StatsSummary:
      type: object
      properties:
        totalPosts:
          type: integer
        totalHelped:
          type: integer
        totalUsers:
          type: integer
        totalLikes:
          type: integer
        categoryBreakdown:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: integer
              totalHelped:
                type: integer
            required:
              - category
              - count
              - totalHelped
      required:
        - totalPosts
        - totalHelped
        - totalUsers
        - totalLikes
        - categoryBreakdown

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        totalHelped:
          type: integer
        postCount:
          type: integer
        totalLikes:
          type: integer
      required:
        - rank
        - user
        - totalHelped
        - postCount
        - totalLikes

    TrendingTag:
      type: object
      properties:
        tag:
          type: string
        count:
          type: integer
      required:
        - tag
        - count
