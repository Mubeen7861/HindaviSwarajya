openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HindaviSwarajya Seva Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current authenticated user
  - name: posts
    description: Seva post operations
  - name: users
    description: User operations
  - name: stats
    description: Platform statistics
  - name: tags
    description: Tag operations
  - name: events
    description: Seva event operations
  - name: help
    description: Help request operations
  - name: storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update current authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated

  /me/posts:
    get:
      operationId: listMyPosts
      tags: [me]
      summary: List the current user's seva posts (all approval statuses)
      responses:
        "200":
          description: User's seva posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SevaPost"
        "401":
          description: Not authenticated

  /me/events:
    get:
      operationId: listMyEvents
      tags: [me]
      summary: List events organized by the current user (all approval statuses)
      responses:
        "200":
          description: User's events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SevaEvent"
        "401":
          description: Not authenticated

  /me/help-requests:
    get:
      operationId: listMyHelpRequests
      tags: [me]
      summary: List help requests created by the current user (all approval statuses)
      responses:
        "200":
          description: User's help requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"
        "401":
          description: Not authenticated

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List seva posts
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [Food, Education, Health, Shelter, Other]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [recent, likes, impact, comments]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of seva posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SevaPost"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a seva post (auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevaPost"
        "401":
          description: Not authenticated

  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a seva post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Seva post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevaPost"
        "404":
          description: Not found
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Update one of your own seva posts (auth required, author-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostBody"
      responses:
        "200":
          description: Updated seva post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevaPost"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden — not the author
        "404":
          description: Not found
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete one of your own seva posts (auth required, author-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden — not the author
        "404":
          description: Not found

  /posts/{id}/like:
    post:
      operationId: toggleLike
      tags: [posts]
      summary: Toggle like on a post (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevaPost"
        "401":
          description: Not authenticated

  /posts/{id}/comments:
    post:
      operationId: addComment
      tags: [posts]
      summary: Add comment to a post (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCommentBody"
      responses:
        "201":
          description: Added comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: Not authenticated

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found

  /users/{id}/follow:
    post:
      operationId: toggleFollow
      tags: [users]
      summary: Follow or unfollow a user (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "401":
          description: Not authenticated

  /users/{id}/posts:
    get:
      operationId: getUserPosts
      tags: [users]
      summary: Get posts by a specific user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User's seva posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SevaPost"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get platform-wide impact summary
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [stats]
      summary: Get top seva contributors
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /tags/trending:
    get:
      operationId: getTrendingTags
      tags: [tags]
      summary: Get trending hashtags
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Trending tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendingTag"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List seva events
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, ongoing, completed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SevaEvent"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a seva event (auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevaEvent"
        "401":
          description: Not authenticated

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevaEvent"
        "404":
          description: Not found
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update one of your own events (auth required, organizer-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SevaEvent"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden — not the organizer
        "404":
          description: Not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete one of your own events (auth required, organizer-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden — not the organizer
        "404":
          description: Not found

  /events/{id}/register:
    post:
      operationId: registerForEvent
      tags: [events]
      summary: Register or unregister for an event (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterEventResult"
        "401":
          description: Not authenticated

  /help-requests:
    get:
      operationId: listHelpRequests
      tags: [help]
      summary: List help requests
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: urgency
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of help requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"
    post:
      operationId: createHelpRequest
      tags: [help]
      summary: Create a help request (auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHelpRequestBody"
      responses:
        "201":
          description: Created help request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "401":
          description: Not authenticated

  /help-requests/{id}:
    get:
      operationId: getHelpRequest
      tags: [help]
      summary: Get a help request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Help request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "404":
          description: Not found
    patch:
      operationId: updateHelpRequest
      tags: [help]
      summary: Update one of your own help requests (auth required, requester-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHelpRequestBody"
      responses:
        "200":
          description: Updated help request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden — not the requester
        "404":
          description: Not found
    delete:
      operationId: deleteHelpRequest
      tags: [help]
      summary: Delete one of your own help requests (auth required, requester-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Not authenticated
        "403":
          description: Forbidden — not the requester
        "404":
          description: Not found

  /help-requests/{id}/join:
    post:
      operationId: joinHelpRequest
      tags: [help]
      summary: Join or leave a help request (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Join status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinHelpRequestResult"
        "401":
          description: Not authenticated

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for direct-to-GCS file upload
      description: |
        Returns a presigned GCS URL. The client sends JSON metadata here, then
        uploads the file bytes directly to the returned URL via PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
        "500":
          description: Failed to generate upload URL

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Rank:
      type: string
      enum:
        - Sevak
        - Mavla
        - Bargir
        - Shiledar
        - Naik
        - Havaldar
        - Jumledar
        - Hazari
        - Panch Hazari
        - Sardar
        - Killedar
        - Deshpande
        - Deshmukh
        - Subhedar
        - Ashta Pradhan
        - Sarnobat
        - Sar Senapati

    SevaCategory:
      type: string
      enum: [Food, Education, Health, Shelter, Other]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
        location:
          type: string
        rank:
          $ref: "#/components/schemas/Rank"
        totalHelped:
          type: integer
        mudra:
          type: integer
          description: Seva points — totalHelped × 10
        chhava:
          type: boolean
          description: Honorary rank awarded by admins; displayed above the normal rank
        followersCount:
          type: integer
        postsCount:
          type: integer
      required:
        - id
        - name
        - avatar
        - location
        - rank
        - totalHelped
        - mudra
        - chhava
        - followersCount
        - postsCount

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            bio:
              type: string
            joinedAt:
              type: string

    UpdateMeBody:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        location:
          type: string

    Comment:
      type: object
      properties:
        id:
          type: integer
        postId:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        userAvatar:
          type: string
        content:
          type: string
        timestamp:
          type: string
      required:
        - id
        - postId
        - userId
        - userName
        - userAvatar
        - content
        - timestamp

    SevaPost:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        content:
          type: string
        category:
          $ref: "#/components/schemas/SevaCategory"
        helpedPeople:
          type: integer
        likes:
          type: integer
        likedBy:
          type: array
          items:
            type: integer
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        tags:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
          maxItems: 3
        timestamp:
          type: string
        location:
          type: string
          nullable: true
        approvalStatus:
          type: string
          enum: [pending, approved, rejected]
      required:
        - id
        - userId
        - user
        - content
        - category
        - helpedPeople
        - likes
        - likedBy
        - comments
        - tags
        - images
        - timestamp

    CreatePostBody:
      type: object
      properties:
        content:
          type: string
        category:
          $ref: "#/components/schemas/SevaCategory"
        helpedPeople:
          type: integer
        tags:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
            pattern: "^/api/storage/objects/[A-Za-z0-9._/-]+$"
          maxItems: 3
        location:
          type: string
          nullable: true
      required:
        - content
        - category
        - helpedPeople
        - tags

    AddCommentBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    FollowResult:
      type: object
      properties:
        following:
          type: boolean
        followersCount:
          type: integer
      required:
        - following
        - followersCount

    StatsSummary:
      type: object
      properties:
        totalPosts:
          type: integer
        totalHelped:
          type: integer
        totalUsers:
          type: integer
        totalLikes:
          type: integer
        categoryBreakdown:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: integer
              totalHelped:
                type: integer
            required:
              - category
              - count
              - totalHelped
      required:
        - totalPosts
        - totalHelped
        - totalUsers
        - totalLikes
        - categoryBreakdown

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        totalHelped:
          type: integer
        postCount:
          type: integer
        totalLikes:
          type: integer
      required:
        - rank
        - user
        - totalHelped
        - postCount
        - totalLikes

    TrendingTag:
      type: object
      properties:
        tag:
          type: string
        count:
          type: integer
      required:
        - tag
        - count

    SevaEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        eventType:
          type: string
        category:
          $ref: "#/components/schemas/SevaCategory"
        date:
          type: string
        time:
          type: string
        location:
          type: string
        address:
          type: string
        organizerId:
          type: integer
        organizer:
          $ref: "#/components/schemas/User"
        volunteersNeeded:
          type: integer
        volunteersRegistered:
          type: array
          items:
            type: integer
        image:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [upcoming, ongoing, completed, cancelled]
        duration:
          type: string
          nullable: true
        requirements:
          type: string
          nullable: true
        createdAt:
          type: string
        approvalStatus:
          type: string
          enum: [pending, approved, rejected]
      required:
        - id
        - title
        - description
        - eventType
        - category
        - date
        - time
        - location
        - address
        - organizerId
        - organizer
        - volunteersNeeded
        - volunteersRegistered
        - tags
        - status
        - createdAt

    CreateEventBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        eventType:
          type: string
        category:
          $ref: "#/components/schemas/SevaCategory"
        date:
          type: string
        time:
          type: string
        location:
          type: string
        address:
          type: string
        volunteersNeeded:
          type: integer
        image:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        duration:
          type: string
          nullable: true
        requirements:
          type: string
          nullable: true
      required:
        - title
        - description
        - eventType
        - category
        - date
        - time
        - location
        - address
        - volunteersNeeded
        - tags

    RegisterEventResult:
      type: object
      properties:
        registered:
          type: boolean
        volunteersRegistered:
          type: array
          items:
            type: integer
      required:
        - registered
        - volunteersRegistered

    HelpRequest:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/SevaCategory"
        urgency:
          type: string
          enum: [Low, Medium, High, Emergency]
        location:
          type: string
        requesterId:
          type: integer
        requester:
          $ref: "#/components/schemas/User"
        peopleNeeded:
          type: integer
        helpersJoined:
          type: array
          items:
            type: integer
        status:
          type: string
          enum: [open, in-progress, completed, cancelled]
        deadline:
          type: string
          nullable: true
        contactInfo:
          type: string
          nullable: true
        createdAt:
          type: string
        approvalStatus:
          type: string
          enum: [pending, approved, rejected]
      required:
